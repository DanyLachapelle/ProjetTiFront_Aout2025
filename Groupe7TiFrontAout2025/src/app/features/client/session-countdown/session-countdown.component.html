<div class="session-card">
  <div class="session-icon">
    <span style="font-size: 2.5rem; color: #5bbd95;">&#9989;</span>
  </div>
  <h2>Accès Autorisé !</h2>
  <div class="session-info">
    <div class="session-active">Session active</div>
    <div class="session-timer">{{ formatTime() }}</div>
    <div class="session-label">Temps restant</div>
  </div>
  <button class="session-btn" (click)="goToMenu()">
    🍹 Accéder au Menu
  </button>
</div>
