<div class="table-card">
  <div class="table-icon">
    <span style="font-size: 2.5rem; color: #5bbd95;">&#128337;</span>
  </div>
  <h2>Numéro de Table</h2>
  <label for="tableNumber">Votre numéro de table</label>
  <input id="tableNumber" [(ngModel)]="tableNumber" placeholder="Ex: T01, T02, T10..." class="table-input" />
  <div class="table-hint">Vous trouverez ce numéro sur votre table</div>
  <button class="table-btn" (click)="validateAndContinue()" [disabled]="loading">
    Confirmer et Continuer
  </button>
  <div *ngIf="error" class="table-error">{{ error }}</div>
</div>
